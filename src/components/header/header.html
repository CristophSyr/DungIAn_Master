<header class="border-b-2 border-dnd-gold/60 bg-dnd-leather/95 sticky top-0 z-40 backdrop-blur-md px-6 py-2.5 flex items-center justify-between shadow-2xl">
  <div class="flex items-center gap-4">
    <div class="wax-seal w-11 h-11 rounded-full flex items-center justify-center text-dnd-goldLight font-dnd-title font-bold text-xl tracking-tighter shadow-lg">
      &amp;
    </div>
    <div>
      <h1 class="font-dnd-title font-bold text-xl tracking-widest text-dnd-goldLight flex items-center gap-3">
        DungIAn <span class="text-[11px] font-dnd-heading px-2.5 py-0.5 rounded bg-dnd-red/60 border border-dnd-gold/40 text-amber-200 uppercase tracking-widest">Pantalla del DM</span>
      </h1>
      <p class="text-xs text-amber-200/60 font-dnd-body italic">Asistente de Co-Creación de Aventuras • D&amp;D 5ª Edición</p>
    </div>
  </div>

  <div id="live-metrics-bar" class="hidden flex items-center gap-5 bg-black/60 border border-dnd-gold/40 px-5 py-1.5 rounded-full text-xs shadow-inner">
    <div class="flex items-center gap-2">
      <span class="text-base text-amber-400">⏳</span>
      <span class="text-stone-300 font-dnd-heading">Tiempo de Prep. (M1):</span>
      <span id="timer-display" class="font-mono font-bold text-amber-300 text-sm">00:00</span>
    </div>
    <div class="h-4 w-px bg-dnd-gold/40"></div>
    <div class="flex items-center gap-2">
      <span class="text-base text-dnd-gold">📜</span>
      <span class="text-stone-300 font-dnd-heading">Elementos Validados (M2):</span>
      <span id="valid-count-display" class="font-bold text-dnd-goldLight bg-dnd-red/50 px-2.5 py-0.5 rounded border border-dnd-gold/40">0</span>
    </div>
  </div>

  <div class="flex items-center gap-3">
    <div id="user-badge" class="hidden text-right font-dnd-body">
      <span id="header-user-name" class="text-xs font-semibold text-dnd-goldLight block">Dungeon Master</span>
      <span class="text-[10px] text-emerald-400 block tracking-wider">● Enlace de Campaña Activo</span>
    </div>
    <button id="btn-reset-grimorio" class="text-xs text-amber-200/80 hover:text-amber-100 bg-dnd-red/50 hover:bg-dnd-red px-3.5 py-1.5 rounded border border-dnd-gold/40 transition font-dnd-heading tracking-wider">
      Reiniciar Grimorio
    </button>
  </div>
</header>
